[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	caligari/Ds1302@^1.1.1
    ESP32Async/AsyncTCP@^3.5.0
    ESP32Async/ESPAsyncWebServer@^3.12.1
    makuna/RTC@^2.5.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
